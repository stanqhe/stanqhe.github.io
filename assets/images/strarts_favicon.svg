  width="512"
  height="512"
  viewBox="0 0 512 512"
  role="img"
  aria-labelledby="strarts-favicon-title"
>
  <title id="strarts-favicon-title">STRARTS favicon</title>

  <rect width="512" height="512" rx="104" fill="#fafafc" />

  <!-- Canonical STRARTS mark scaled uniformly to 70% of canvas height. -->
  <g transform="translate(52.1102 52.1102) scale(0.7964444)">
    <g
      fill="none"
      stroke="#1d1d1f"
      stroke-width="20"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <!-- Upper arc with connected outer dash -->
      <path
        d="
          M 100.437 100.437
          A 220 220 0 0 1 411.563 100.437
          L 369.491 142.509
        "
      />

      <!-- Lower arc with connected outer dash -->
      <path
        d="
          M 411.563 411.563
          A 220 220 0 0 1 100.437 411.563
          L 142.509 369.491
        "
      />

      <!-- Inner dashes -->
      <path
        d="
          M 194.835 317.165
          L 229.837 282.163
        "
      />

      <path
        d="
          M 317.165 194.835
          L 282.163 229.837
        "
      />

      <!-- Solid diagonal -->
      <path
        d="
          M 100.437 100.437
          L 411.563 411.563
        "
      />
    </g>

    <!-- Visible dots and exact hidden center dot -->
    <g fill="#1d1d1f">
      <circle cx="168.672" cy="343.328" r="10" />
      <circle cx="256" cy="256" r="10" />
      <circle cx="343.328" cy="168.672" r="10" />
    </g>
  </g>
