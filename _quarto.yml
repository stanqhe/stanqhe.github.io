project:
  type: website
  output-dir: _site

website:
  title: "Stan Q. He"
  favicon: assets/images/strarts_mark.svg
  site-url: "https://stanqhe.github.io"
  google-analytics: "G-WX3RQDGV80"
  page-footer:
    left: "© 2026 Stan Q. He. All rights reserved."
    center: "[Terms of Use](/legal.html)"

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    css:
      - styles/mega-menu.css
      - styles/main.css
    toc: true
    toc-location: right
    toc-depth: 3
    smooth-scroll: true
    anchor-sections: false
    include-in-header:
      - includes/theme-toggle-scroll.html
    include-before-body:
      - includes/site-navbar.html
      - includes/mega-menu.html
    include-after-body:
      - includes/toc-enhance.html
      - includes/mega-menu-script.html
    respect-user-color-scheme: true
