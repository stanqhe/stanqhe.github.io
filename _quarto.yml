project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "life/**/*.qmd"
    - "study/**/*.qmd"
    - "work/**/*.qmd"

website:
  title: "Stan Q. He"
  favicon: assets/images/strarts_favicon.svg
  site-url: "https://stanqhe.github.io"
  google-analytics: "G-WX3RQDGV80"
  page-footer:
    left: "© 2026 Stan Q. He. All rights reserved."
    center: "[Terms of Use](/legal.html)"

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    css:
      - _styles/mega-menu.css
      - _styles/main.css
      - _styles/editorial.css
      - _styles/listing.css
      - _styles/toc.css
    toc: true
    toc-location: right
    toc-depth: 3
    smooth-scroll: true
    anchor-sections: false
    footnotes-hover: false
    include-in-header:
      - _includes/theme-toggle-scroll.html
    include-before-body:
      - _includes/site-navbar.html
      - _includes/mega-menu.html
    include-after-body:
      - _includes/toc-enhance.html
      - _includes/mega-menu-script.html
    respect-user-color-scheme: true
